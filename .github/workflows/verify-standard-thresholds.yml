name: Verify combined standard thresholds
on:
  push:
    branches: [verify/combine-standard-thresholds-98d36aafee]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      RH_BASE: 98d36aafeeb30c1f40fdda96c3574faa34dfa413
      RH_HEAD: cb89b560593ef1489ba1804d91a94f221921dd2c
      RH_MODULE: Development.AutomorphicArithmetic.CharacterBoxes.ObjCTrue
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
      LEAN_NUM_THREADS: '2'
      LEAN_ABORT_ON_PANIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Check candidate and install the pinned Lean toolchain
        run: |
          test "$(git rev-parse HEAD^)" = "$RH_HEAD"
          test "$(git rev-parse "$RH_HEAD^")" = "$RH_BASE"
          git diff --exit-code "$RH_HEAD" HEAD -- src lakefile.toml lake-manifest.json lean-toolchain
          git diff --check "$RH_BASE" "$RH_HEAD"
          mkdir -p "$RUNNER_TEMP/rh-threshold-check"/{baseline,candidate}
          cp .github/workflows/threshold-verification/*.lean "$RUNNER_TEMP/rh-threshold-check/"
          uname -n
          free -h
          df -h "$GITHUB_WORKSPACE"
          sudo sysctl -w vm.max_map_count=1048576
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the complete upstream cache
        run: |
          mkdir -p .lake
          if command -v mkfs.btrfs >/dev/null && sudo modprobe btrfs; then
            rh_volume="$RUNNER_TEMP/rh-build.btrfs"
            truncate -s 120G "$rh_volume"
            mkfs.btrfs --quiet --nodiscard "$rh_volume"
            sudo mount -o loop,compress-force=zstd:3 "$rh_volume" .lake
            sudo chown "$(id -u):$(id -g)" .lake
          else
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h "$GITHUB_WORKSPACE" .lake
          git -c advice.detachedHead=false checkout --detach "$RH_BASE"
          lake --version
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          timeout 18m lake exe mathlib/cache get
          timeout 55m python3 scripts/ci-cache-get.py --jobs 4
      - name: Check the explicit witness on upstream
        run: |
          rh_audit="$RUNNER_TEMP/rh-threshold-check"
          timeout 6m lake env lean -j2 --tstack=400000 -DmaxHeartbeats=4000000 -R "$rh_audit" \
            -o "$rh_audit/baseline/StandardThresholdWitness.olean" "$rh_audit/StandardThresholdWitness.lean"
          LEAN_PATH="$rh_audit/baseline" timeout 4m lake env leanchecker -v StandardThresholdWitness
      - name: Build all default targets at the PR head
        run: |
          git -c advice.detachedHead=false checkout --detach "$RH_HEAD"
          test "$(git rev-parse HEAD)" = "$RH_HEAD"
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          timeout 48m lake build
          git diff --exit-code -- src lakefile.toml lake-manifest.json lean-toolchain
      - name: Check both thresholds and replay the proof and witness
        run: |
          rh_audit="$RUNNER_TEMP/rh-threshold-check"
          export LEAN_PATH="$rh_audit/candidate"
          for audit in StandardThresholdWitness StandardThresholdsAudit; do
            timeout 6m lake env lean -j2 --tstack=400000 -DmaxHeartbeats=4000000 -R "$rh_audit" \
              -o "$LEAN_PATH/$audit.olean" "$rh_audit/$audit.lean"
          done
          for module in "$RH_MODULE" StandardThresholdWitness StandardThresholdsAudit; do
            timeout 7m lake env leanchecker -v "$module"
          done
