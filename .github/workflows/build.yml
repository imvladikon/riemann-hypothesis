name: Verify the fourth-power main inequality
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    defaults:
      run:
        shell: bash
    env:
      RH_BASE: 843cb9db91a39362b8d3b9f0de7a98bb651660e2
      RH_HEAD: ed3a25a732d656735aad22031a1fcbbd1abd0939
      RH_BASE_SOURCE: 213845d02a01530329b600e1923ac732aceba625
      RH_COMPLETION: b507dc564769d1107f5b0e27f34cb0ea626ba88a
      RH_COMBINED_TREE: 6074941a7494a2b0475f3aa66feaefb9e5d2b991
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
      LEAN_NUM_THREADS: '2'
      LEAN_ABORT_ON_PANIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 5
          persist-credentials: false
      - name: Verify the pinned proposal and install Lean
        run: |
          test "$(git rev-parse HEAD^)" = "$RH_HEAD"
          test "$(git rev-parse "$RH_HEAD^")" = "$RH_BASE"
          test "$(git rev-parse "$RH_BASE:src")" = "$RH_BASE_SOURCE"
          git diff --exit-code "$RH_HEAD" HEAD -- src GUIDE.md lakefile.toml lake-manifest.json lean-toolchain
          git diff --check "$RH_BASE" "$RH_HEAD"
          git diff --exit-code "$RH_BASE" "$RH_HEAD" -- Challenge.lean comparator.json src/Main.lean src/New/Main.lean src/Statements.lean lakefile.toml lake-manifest.json lean-toolchain
          mkdir -p "$RUNNER_TEMP/rh-fourth-power"
          cp .github/workflows/fourth-power-verification/FourthPowerAudit.lean "$RUNNER_TEMP/rh-fourth-power/"
          uname -n
          free -h
          df -h "$GITHUB_WORKSPACE"
          sudo sysctl -w vm.max_map_count=1048576
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Validate and restore the exact cache for batch m3
        run: |
          mkdir -p .lake
          if command -v mkfs.btrfs >/dev/null && sudo modprobe btrfs; then
            rh_volume="$RUNNER_TEMP/rh-build.btrfs"
            truncate -s 120G "$rh_volume"
            mkfs.btrfs --quiet --nodiscard "$rh_volume"
            sudo mount -o loop,compress-force=zstd:3 "$rh_volume" .lake
            sudo chown "$(id -u):$(id -g)" .lake
          else
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          git -c advice.detachedHead=false checkout --detach "$RH_BASE"
          lake --version
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          timeout 18m lake exe mathlib/cache get
          timeout 12m python3 scripts/tauceti-cache-get.py
          ulimit -Sn "$(ulimit -Hn)"
          timeout 38m python3 scripts/ci-cache-get.py --jobs 6
      - name: Build all default targets at the proposal
        run: |
          git -c advice.detachedHead=false checkout --detach "$RH_HEAD"
          test "$(git rev-parse HEAD)" = "$RH_HEAD"
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          rh_log="$RUNNER_TEMP/rh-fourth-power/lake-build.log"
          timeout 36m lake build 2>&1 | tee "$rh_log"
          if rg -F "declaration uses 'sorry'" "$rh_log"; then
            exit 1
          fi
          git diff --exit-code -- src lakefile.toml lake-manifest.json lean-toolchain
      - name: Verify the previous bounds, the proof chain and axioms
        run: |
          rh_audit="$RUNNER_TEMP/rh-fourth-power"
          export LEAN_PATH="$rh_audit"
          timeout 8m lake env lean -j2 --tstack=400000 -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -R "$rh_audit" -o "$rh_audit/FourthPowerAudit.olean" "$rh_audit/FourthPowerAudit.lean"
          timeout 7m lake env leanchecker -v FourthPowerAudit
      - name: Replay the main inequality and its production route
        run: |
          for module in New.Reduction.MainInequality New.Reduction.OneSidedBound New.Main Main; do
            timeout 8m lake env leanchecker -v "$module"
          done
      - name: Build the exact combined tree with PR 5644
        run: |
          git fetch --no-tags --depth=2 origin "$RH_COMPLETION"
          test "$(git rev-parse FETCH_HEAD)" = "$RH_COMPLETION"
          test "$(git merge-tree --write-tree "$RH_HEAD" "$RH_COMPLETION")" = "$RH_COMBINED_TREE"
          git read-tree --reset -u "$RH_COMBINED_TREE"
          test "$(git write-tree)" = "$RH_COMBINED_TREE"
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          timeout 24m lake build
          git diff --exit-code -- src GUIDE.md lakefile.toml lake-manifest.json lean-toolchain
          rh_audit="$RUNNER_TEMP/rh-fourth-power"
          timeout 8m lake env lean -j2 --tstack=400000 -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -R "$rh_audit" "$rh_audit/FourthPowerAudit.lean"
